[package]
name = "inspectah-refine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inspectah-core = { path = "../core" }
inspectah-pipeline = { path = "../pipeline" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
similar = "2"
thiserror.workspace = true
tempfile = "3"
tar = "0.4"
flate2 = "1"
walkdir = "2"
# geteuid() for the upload directory's ownership check, without an unsafe
# libc call. Already in the tree: tempfile depends on it.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tar = "0.4"
flate2 = "1"
walkdir = "2"
