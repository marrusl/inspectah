[package]
name = "inspectah-web"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
autotests = false

[dependencies]
inspectah-core = { path = "../core" }
inspectah-pipeline = { path = "../pipeline" }
inspectah-refine = { path = "../refine" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "multipart", "tokio"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync"] }
mime_guess = "2"
tempfile.workspace = true
regex = "1"

[dev-dependencies]
# Counts repo file parses, so a test can bound the parses one refine
# operation makes. A dev-dependency feature, so release builds never see it.
inspectah-core = { path = "../core", features = ["test-support"] }
tempfile.workspace = true
# `#[tokio::test]` and the upload tests' timeouts need the macros and the
# timer, which the shipped feature list leaves out.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The collector-driven sysctl hosts (`crates/cli/tests/support/sysctl_hosts.rs`)
# build their executor from `MockExecutor`.
inspectah-collect = { path = "../collect" }
# Lazy request bodies for the upload tests: a 500 MiB body streamed a
# chunk at a time, and one that stalls mid-transfer.
futures-core = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
insta = { workspace = true }
tar = "0.4"
flate2 = "1"

[[test]]
name = "integration"
path = "tests/main.rs"
