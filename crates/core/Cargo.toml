[package]
name = "inspectah-core"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
time = { version = "0.3", features = ["serde", "serde-well-known", "parsing", "formatting"] }

[features]
# Counts parse_repo_sections calls, for tests in other crates that pin how
# often a caller parses repo files. Enable it only as a dev-dependency.
test-support = []

[dev-dependencies]
proptest = "1"

[[test]]
name = "integration"
path = "tests/main.rs"
