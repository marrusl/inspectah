[package]
name = "inspectah-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
inspectah-core = { path = "../core" }
inspectah-collect = { path = "../collect" }
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow = "1"
tar = "0.4"
flate2 = "1"
walkdir = "2"
chrono = "0.4"
base64 = "0.22"
dirs = "5"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
minijinja = { version = "2", features = ["builtins"] }

[dev-dependencies]
# Counts repo file parses, so routing tests can pin that each file is
# parsed once. A dev-dependency feature, so release builds never see it.
inspectah-core = { path = "../core", features = ["test-support"] }
insta.workspace = true
tempfile.workspace = true
# Parses the blueprint TOML fragment in tests, to prove a snapshot value
# cannot add a key.
toml = "0.8"
# Joins pattern fragments at random to check that redaction never panics
# and covers every captured secret. Already in the workspace through
# inspectah-core.
proptest = "1"

[[test]]
name = "integration"
path = "tests/main.rs"
