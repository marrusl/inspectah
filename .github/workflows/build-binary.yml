name: Build binary

# One build recipe for both uses: a smoke build on pushes to main, and the
# release build, which release.yml calls on a version tag. The asset names
# below are the published release asset names, and the Homebrew formula's
# `install` names inspectah-darwin-arm64, so renaming one breaks the tap.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'crates/*/src/**'
      - 'crates/*/Cargo.toml'
      # build.rs in web embeds the UI and in cli stamps the version.
      - 'crates/*/build.rs'
      - 'crates/web/ui/src/**'
      - 'crates/web/ui/package.json'
      - 'crates/web/ui/package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      # The release recipe itself.
      - '.github/workflows/build-binary.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Every leg reports: one failing target must not hide whether the
      # others build.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            asset: inspectah-linux-amd64
          # The -bin suffix tells it apart from the macOS ARM64 binary.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: inspectah-linux-arm64-bin
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: inspectah-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Version from rust-toolchain.toml, as in rust-ci.yml. Targets stay
      # out of that file so local builds do not download them.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # Same Node line as rust-ci.yml. The frontend is built into the binary
      # by crates/web/build.rs, so this is the Node that builds the shipped UI.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: crates/web/ui/package-lock.json

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # INSPECTAH_SKIP_UI must never be set here: a binary built with it
      # ships without the web UI.
      - name: Build release binary
        run: cargo build -p inspectah-cli --release --target ${{ matrix.target }}

      # Every leg runs on its own architecture, so each binary can report its
      # own version. Checks what shipped, not what was intended: the version
      # line, static linking on Linux, and the embedded UI.
      - name: Verify binary
        shell: bash
        env:
          BIN: target/${{ matrix.target }}/release/inspectah
          UI_ASSETS: crates/web/ui/dist/assets
          # The caller's ref: a tag when release.yml builds a release.
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          # crates/cli/build.rs prints the bare version only for a build of
          # the tag v<version>, and <version>+g<short hash> otherwise.
          if [ "$REF_TYPE" = "tag" ]; then FORM=tagged; else FORM=untagged; fi
          scripts/check-version-stamp.sh run "$BIN" "$FORM"

          if [ "$RUNNER_OS" = "Linux" ]; then
            # Rust musl targets link static-pie, which file(1) reports as
            # "static-pie linked" rather than "statically linked".
            FILE_OUT=$(file -b "$BIN")
            echo "$FILE_OUT"
            if ! printf '%s' "$FILE_OUT" | grep -Eq 'statically linked|static-pie linked'; then
              echo "::error::${BIN} is not statically linked" >&2
              exit 1
            fi
          fi

          # The frontend is embedded by path, so its content-hashed asset
          # names appear verbatim in the binary.
          for name in index.html $(ls "$UI_ASSETS" | grep -E '^index-'); do
            if ! LC_ALL=C grep -qaF -- "$name" "$BIN"; then
              echo "::error::${BIN} does not embed ${name}; the web UI is missing" >&2
              exit 1
            fi
            echo "embedded: ${name}"
          done

      - name: Stage under the release asset name
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/inspectah" "dist/${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 30
