name: Package release

on:
  release:
    types: [published]
  # Manual runs exist so this pipeline can be exercised without shipping.
  # A `release` re-run replays the original run's definition, so before this
  # trigger the only way to fire the pipeline was to publish a release, which
  # is why it stayed broken across four months of releases.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.9.0-beta.4"
        required: true
        type: string

permissions:
  contents: write

# The release payload is empty on a manual run and the dispatch input is empty
# on a release, so exactly one of these is ever set. The release is named first
# because it is the production path; the input is the fallback.
# GITHUB_REF_NAME is NOT a substitute: on a manual run it holds the branch, not
# the tag.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-srpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # Must run before actions/checkout. Without git on PATH the action
      # falls back to downloading a REST API tarball, which leaves no .git
      # directory, and .copr/Makefile builds its source tree with
      # `git archive HEAD`. The fedora:latest image ships no git.
      - name: Install git for checkout
        run: dnf install -y git make

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify version consistency
        run: |
          SPEC_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' packaging/inspectah.spec)
          # Cargo.toml uses semver prerelease (e.g. 0.8.1-alpha.3), RPM spec
          # uses tilde (0.8.1~alpha.3). Normalize for comparison.
          CARGO_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1)
          RPM_CARGO_VERSION=$(echo "$CARGO_VERSION" | sed 's/-/~/')
          TAG_VERSION="${RELEASE_TAG#v}"
          RPM_TAG_VERSION=$(echo "$TAG_VERSION" | sed 's/-/~/')
          if [ "$SPEC_VERSION" != "$RPM_CARGO_VERSION" ]; then
            echo "Version mismatch: packaging/inspectah.spec=$SPEC_VERSION Cargo.toml=$CARGO_VERSION (normalized: $RPM_CARGO_VERSION)" >&2
            exit 1
          fi
          if [ "$SPEC_VERSION" != "$RPM_TAG_VERSION" ]; then
            echo "Version mismatch: packaging/inspectah.spec=$SPEC_VERSION tag=$TAG_VERSION (normalized: $RPM_TAG_VERSION)" >&2
            exit 1
          fi

      # Use the same recipe COPR uses rather than a second one. The previous
      # plain `tar czf --exclude-vcs .` of the checkout could never work: the
      # spec's %build runs cargo, which drives crates/web/build.rs, and that
      # needs either npm on PATH or a pre-built crates/web/ui/dist. dist is
      # gitignored, so a fresh checkout never contains it and the RPM build
      # panicked on every release. The Makefile pre-builds the UI and vendors
      # the crates, so the SRPM rebuilds offline with only cargo and rust.
      - name: Build SRPM
        run: |
          # Works around a container-UID mismatch, not a recipe problem.
          # actions/checkout writes the tree as a different UID than the one
          # running this step, so git rejects it with "detected dubious
          # ownership" and `git archive HEAD` in .copr/Makefile emits an empty
          # stream that fails downstream as a gzip error. Seen in run
          # 41919295805. Scoped to this checkout rather than '*'.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -f .copr/Makefile srpm outdir="$PWD"

      # Release runs only. A manual run has no release payload, so
      # context.payload.release.id is undefined and this step would throw; and
      # pointing a test run at an already-published tag would replace assets
      # users may already have downloaded. A manual run builds and verifies
      # without touching anything outside the runner.
      - name: Upload SRPM to release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                per_page: 100,
              }
            );
            for (const file of fs.readdirSync('.')) {
              if (!file.endsWith('.src.rpm')) continue;
              const existing = assets.find((asset) => asset.name === file);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                name: file,
                data: fs.readFileSync(file),
              });
            }

      - name: Upload SRPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: srpm
          path: "*.src.rpm"

  build-rpm:
    needs: build-srpm
    runs-on: ubuntu-latest
    strategy:
      # One leg's failure must not cancel the others: until now a single
      # failing target masked whether the rest build at all.
      fail-fast: false
      matrix:
        target:
          - { name: "fedora", container: "fedora:latest" }
          - { name: "el9", container: "quay.io/centos/centos:stream9" }
          - { name: "el10", container: "quay.io/centos/centos:stream10" }
    container: ${{ matrix.target.container }}
    steps:
      - name: Download SRPM
        uses: actions/download-artifact@v4
        with:
          name: srpm

      - name: Enable EPEL and CRB repositories
        if: matrix.target.name != 'fedora'
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb

      - name: Install build tools
        run: dnf install -y rpm-build dnf-plugins-core

      - name: Build RPM
        run: |
          dnf builddep -y *.src.rpm
          rpmbuild --rebuild *.src.rpm
          find ~/rpmbuild/RPMS -name '*.rpm' ! -name '*.src.rpm' -exec cp {} . \;

      # Runs on both triggers, mirroring the SRPM artifact upload. Without it a
      # manual run would build the RPMs and discard them, leaving green as the
      # only evidence; with it the packages can be downloaded and inspected.
      # The name is per-leg because upload-artifact rejects duplicate names.
      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.target.name }}
          # The SRPM was downloaded into this directory, so exclude it: this
          # artifact is the built binary packages only.
          path: |
            *.rpm
            !*.src.rpm

      # Release runs only, for the same reasons as the SRPM upload above.
      - name: Upload RPM to release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                per_page: 100,
              }
            );
            for (const file of fs.readdirSync('.')) {
              if (!file.endsWith('.rpm') || file.endsWith('.src.rpm')) continue;
              const existing = assets.find((asset) => asset.name === file);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                name: file,
                data: fs.readFileSync(file),
              });
            }

  # Release runs only. This job pushes a branch and opens a pull request on the
  # tap repo, and a manual test run must not do either. Its tag references are
  # left on the release payload deliberately: the job never runs without one.
  update-homebrew:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # The formula is a BINARY formula: its `install` is
      # `bin.install "inspectah-darwin-arm64" => "inspectah"`, so `url` must
      # point at the release asset of that name. This step previously
      # computed the *source tarball* URL and digest, which produced a
      # formula whose install looked for a file a source checkout does not
      # contain. Every automated tap PR since March has been unmergeable for
      # that reason, and the job reported success each time because opening
      # a PR is all it ever checked.
      - name: Resolve the darwin binary asset
        id: asset
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          ASSET_NAME: inspectah-darwin-arm64
          # The asset is uploaded during release creation, by a different
          # process than this workflow, so it can still be in flight when
          # `release: published` fires. Measured on v0.9.0-beta.4: the asset
          # finished uploading at 18:56:02Z and the release published_at was
          # 18:56:02Z, the same second. That is a tie, not a margin, so wait
          # for the asset rather than assuming it.
          ASSET_WAIT_ATTEMPTS: "30"
          ASSET_WAIT_SECONDS: "10"
          # sha256 of zero bytes. If curl ever writes an empty file and we
          # fail to notice, this is the digest we would publish.
          EMPTY_SHA256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"

          ok=""
          for i in $(seq 1 "$ASSET_WAIT_ATTEMPTS"); do
            # -f so an HTTP error is a non-zero exit rather than an error
            # page written to the output file and hashed as if it were the
            # binary.
            if curl -fsSL -o asset.bin "$URL"; then ok=yes; break; fi
            echo "attempt $i: ${ASSET_NAME} not downloadable yet, waiting"
            sleep "$ASSET_WAIT_SECONDS"
          done
          if [ -z "$ok" ]; then
            echo "::error::${URL} never became downloadable. The tap was not updated." >&2
            exit 1
          fi

          SHA=$(sha256sum asset.bin | cut -d' ' -f1)

          if [ "${#SHA}" -ne 64 ]; then
            echo "::error::computed sha256 is not 64 characters: '${SHA}'" >&2
            exit 1
          fi
          if [ "$SHA" = "$EMPTY_SHA256" ]; then
            echo "::error::asset hashed as empty; refusing to publish that digest" >&2
            exit 1
          fi

          echo "resolved ${ASSET_NAME} for ${RELEASE_TAG}: ${SHA}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: marrusl/homebrew-inspectah
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.asset.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
          ASSET_URL: ${{ steps.asset.outputs.url }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          # `version` was never substituted before, so a merged PR would have
          # left the old version beside the new url and failed the formula's
          # own test block, which asserts version.to_s appears in
          # `inspectah version` output. `install` is deliberately untouched.
          sed -i \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  url \".*\"|  url \"${ASSET_URL}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            Formula/inspectah.rb

          # Confirm each substitution actually landed. If the formula is ever
          # restructured so a pattern stops matching, sed exits 0 having
          # changed nothing and the job would otherwise report success while
          # delivering a stale formula.
          for expected in "version \"${VERSION}\"" "url \"${ASSET_URL}\"" "sha256 \"${SHA256}\""; do
            if ! grep -qF "$expected" Formula/inspectah.rb; then
              echo "::error::substitution did not land: ${expected}" >&2
              echo "The formula may have been restructured. Not updating the tap." >&2
              exit 1
            fi
          done

          echo "Updated formula to ${VERSION} (sha256: ${SHA256})"

      - name: Open PR against tap repo
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        working-directory: homebrew-tap
        run: |
          TAG="${{ github.event.release.tag_name }}"
          BRANCH="update-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH":"refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH"
          git add Formula/inspectah.rb
          if git diff --cached --quiet; then
            # Previously `exit 0`. The substitutions are verified above, so
            # reaching here means the formula already matched this release:
            # a re-run, or a tap someone updated by hand. That is not an
            # error, but it must not look like a delivered update either.
            echo "::notice::Formula already at ${TAG}; nothing to push."
            exit 0
          fi
          git commit -m "Update inspectah to ${TAG}"
          git push -u origin "HEAD:${BRANCH}" --force-with-lease
          PR_BODY="Automated formula update from [inspectah ${TAG}](https://github.com/${{ github.repository }}/releases/tag/${TAG})."
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --title "Update inspectah to ${TAG}" \
              --body "$PR_BODY"
          else
            gh pr create \
              --title "Update inspectah to ${TAG}" \
              --body "$PR_BODY"
          fi
