name: Package release

on:
  release:
    types: [published]
  # Manual runs exist so this pipeline can be exercised without shipping.
  # A `release` re-run replays the original run's definition, so before this
  # trigger the only way to fire the pipeline was to publish a release, which
  # is why it stayed broken across four months of releases.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.9.0-beta.4"
        required: true
        type: string

# Nothing by default; each job is granted what it needs. The jobs that build
# run npm, cargo and rpmbuild, so they get read access only, and the write
# access release assets need lives in attach-packages, which runs nothing
# it is given.
permissions: {}

# The release payload is empty on a manual run and the dispatch input is empty
# on a release, so exactly one of these is ever set. The release is named first
# because it is the production path; the input is the fallback.
# GITHUB_REF_NAME is NOT a substitute: on a manual run it holds the branch, not
# the tag.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-srpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: read
    steps:
      # Must run before actions/checkout. Without git on PATH the action
      # falls back to downloading a REST API tarball, which leaves no .git
      # directory, and .copr/Makefile builds its source tree with
      # `git archive HEAD`. The fedora:latest image ships no git.
      - name: Install git for checkout
        run: dnf install -y git make

      # persist-credentials: false, because .copr/Makefile runs npm ci and
      # the UI build in this checkout, and a token left in .git/config would
      # be readable by any npm lifecycle script.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify version consistency
        run: |
          SPEC_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' packaging/inspectah.spec)
          # Cargo.toml uses semver prerelease (e.g. 0.8.1-alpha.3), RPM spec
          # uses tilde (0.8.1~alpha.3). Normalize for comparison.
          CARGO_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1)
          RPM_CARGO_VERSION=$(echo "$CARGO_VERSION" | sed 's/-/~/')
          TAG_VERSION="${RELEASE_TAG#v}"
          RPM_TAG_VERSION=$(echo "$TAG_VERSION" | sed 's/-/~/')
          if [ "$SPEC_VERSION" != "$RPM_CARGO_VERSION" ]; then
            echo "Version mismatch: packaging/inspectah.spec=$SPEC_VERSION Cargo.toml=$CARGO_VERSION (normalized: $RPM_CARGO_VERSION)" >&2
            exit 1
          fi
          if [ "$SPEC_VERSION" != "$RPM_TAG_VERSION" ]; then
            echo "Version mismatch: packaging/inspectah.spec=$SPEC_VERSION tag=$TAG_VERSION (normalized: $RPM_TAG_VERSION)" >&2
            exit 1
          fi

      # Use the same recipe COPR uses rather than a second one. The previous
      # plain `tar czf --exclude-vcs .` of the checkout could never work: the
      # spec's %build runs cargo, which drives crates/web/build.rs, and that
      # needs either npm on PATH or a pre-built crates/web/ui/dist. dist is
      # gitignored, so a fresh checkout never contains it and the RPM build
      # panicked on every release. The Makefile pre-builds the UI and vendors
      # the crates, so the SRPM rebuilds offline with only cargo and rust.
      - name: Build SRPM
        run: |
          # Works around a container-UID mismatch, not a recipe problem.
          # actions/checkout writes the tree as a different UID than the one
          # running this step, so git rejects it with "detected dubious
          # ownership" and `git archive HEAD` in .copr/Makefile emits an empty
          # stream that fails downstream as a gzip error. Seen in run
          # 41919295805. Scoped to this checkout rather than '*'.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -f .copr/Makefile srpm outdir="$PWD"

      - name: Upload SRPM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: srpm
          path: "*.src.rpm"

  build-rpm:
    needs: build-srpm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One leg's failure must not cancel the others: until now a single
      # failing target masked whether the rest build at all.
      fail-fast: false
      matrix:
        target:
          - { name: "fedora", container: "fedora:latest" }
          - { name: "el9", container: "quay.io/centos/centos:stream9" }
          - { name: "el10", container: "quay.io/centos/centos:stream10" }
    container: ${{ matrix.target.container }}
    steps:
      - name: Download SRPM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: srpm

      - name: Enable EPEL and CRB repositories
        if: matrix.target.name != 'fedora'
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb

      - name: Install build tools
        run: dnf install -y rpm-build dnf-plugins-core

      - name: Build RPM
        run: |
          dnf builddep -y *.src.rpm
          rpmbuild --rebuild *.src.rpm
          find ~/rpmbuild/RPMS -name '*.rpm' ! -name '*.src.rpm' -exec cp {} . \;

      # Runs on both triggers, mirroring the SRPM artifact upload. Without it a
      # manual run would build the RPMs and discard them, leaving green as the
      # only evidence; with it the packages can be downloaded and inspected.
      # It is also how attach-packages receives them on a release.
      # The name is per-leg because upload-artifact rejects duplicate names.
      - name: Upload RPM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.target.name }}
          # The SRPM was downloaded into this directory, so exclude it: this
          # artifact is the built binary packages only.
          path: |
            *.rpm
            !*.src.rpm

  # Release runs only. A manual run has no release payload, so
  # context.payload.release.id is undefined and the script would throw; and
  # pointing a test run at an already-published tag would replace assets
  # users may already have downloaded. A manual run builds and verifies
  # without touching anything outside the runner.
  #
  # The only job here with write access. It checks nothing out and runs
  # nothing it receives: the packages arrive as artifacts and are read as
  # bytes and uploaded.
  #
  # !cancelled() keeps the old per-leg behaviour: an RPM leg that fails does
  # not stop the SRPM and the legs that built from being attached. The failed
  # leg still fails the run.
  attach-packages:
    needs: [build-srpm, build-rpm]
    if: github.event_name == 'release' && !cancelled() && needs.build-srpm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # srpm and rpm-<target>, as uploaded above.
      - name: Receive the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*rpm*'
          path: packages
          merge-multiple: true

      - name: Upload packages to release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'packages';
            const files = fs.readdirSync(dir).filter((file) => file.endsWith('.rpm'));
            if (!files.some((file) => file.endsWith('.src.rpm'))) {
              core.setFailed('no SRPM among the received packages');
              return;
            }
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                per_page: 100,
              }
            );
            for (const file of files) {
              const existing = assets.find((asset) => asset.name === file);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                name: file,
                data: fs.readFileSync(path.join(dir, file)),
              });
              core.info(`attached ${file}`);
            }

  # Release runs only, for the same reason as attach-packages: a manual run
  # must not ship, and a COPR build publishes to every user who has the repo
  # enabled.
  #
  # COPR used to build from a GitHub webhook. COPR's handler starts builds
  # only from push and tag-create payloads, so a webhook limited to release
  # events never builds, and tag-create also fires on every new branch. This
  # job is how a published release, and nothing else, reaches COPR.
  #
  # It uploads the SRPM build-srpm already made, so COPR rebuilds the same
  # source the release's RPMs came from. It checks nothing out and runs
  # nothing it receives; COPR_CONFIG exists only here. It waits for the COPR
  # build so this job's result is the build's result. Which chroots build is
  # set on the COPR project, not here.
  copr-build:
    needs: build-srpm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    container: fedora:latest
    # The artifact download authenticates with the runner's own token, not
    # GITHUB_TOKEN, so this job needs no grant.
    permissions: {}
    env:
      COPR_PROJECT: mrussell/inspectah
    steps:
      - name: Receive the SRPM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: srpm

      - name: Install copr-cli
        run: dnf install -y copr-cli

      # The secret holds the whole [copr-cli] block from
      # https://copr.fedorainfracloud.org/api/. The token in it expires 180
      # days after it is generated.
      - name: Write the COPR config
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::The COPR_CONFIG repository secret is not set. Paste the [copr-cli] block from https://copr.fedorainfracloud.org/api/ into it." >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr

      # Exactly one SRPM, or the upload would build whatever else came along.
      # copr-cli checks the credentials before it uploads anything and exits
      # 4 when a build it watched failed; any other failure is the request
      # itself, most often an expired token.
      - name: Build in COPR
        env:
          COPR_BUILD_FAILED_EXIT: "4"
        run: |
          set -euo pipefail
          shopt -s nullglob
          srpms=(*.src.rpm)
          if [ "${#srpms[@]}" -ne 1 ]; then
            echo "::error::expected exactly one SRPM, found ${#srpms[@]}: ${srpms[*]}" >&2
            exit 1
          fi
          rc=0
          copr-cli build "$COPR_PROJECT" "${srpms[0]}" || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq "$COPR_BUILD_FAILED_EXIT" ]; then
            echo "::error::the COPR build failed; its log is linked from https://copr.fedorainfracloud.org/coprs/${COPR_PROJECT}/builds/" >&2
          else
            echo "::error::copr-cli failed while submitting or watching the build (exit ${rc}). The build may already be submitted: check https://copr.fedorainfracloud.org/coprs/${COPR_PROJECT}/builds/ before re-running. Only if the log above shows an authentication or token error has the token expired: it lasts 180 days, so generate a new one at https://copr.fedorainfracloud.org/api/ and replace the COPR_CONFIG secret." >&2
          fi
          exit "$rc"

  # Release runs only. These two jobs push to the tap's main branch, and a
  # manual test run must not. Their tag references are left on the release
  # payload deliberately: they never run without one.
  #
  # There is no pull request and no review on the tap: the formula lands by
  # direct push (Mark, 2026-08-16), so the gate is here instead. The new
  # formula is installed and tested with brew before anything is pushed, which
  # is why the test job runs on macOS: the formula only installs on arm64
  # macOS.
  #
  # Testing and pushing are separate jobs on separate fresh runners because
  # the test runs code from the release: the binary, and the formula itself,
  # which is Ruby. Code that runs on a runner can leave something behind for a
  # later step on that runner, a git pre-push hook for one, so keeping the
  # token out of the test steps' environment is not enough while the push
  # shares their runner. HOMEBREW_TAP_TOKEN exists only in homebrew-push,
  # which receives data and nothing else, rebuilds the commit from its own
  # clean checkout, and runs nothing that came from the release.
  homebrew-test:
    if: github.event_name == 'release'
    runs-on: macos-latest
    permissions:
      contents: read
    # The data homebrew-push receives, besides the formula artifact. Every one
    # is set by a step that runs before anything from the release does.
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      base: ${{ steps.order.outputs.base }}
      sha256: ${{ steps.asset.outputs.sha256 }}
    env:
      TAP_REPO: marrusl/homebrew-inspectah
      TAP_BRANCH: main
      FORMULA: Formula/inspectah.rb
      # brew needs a user/repo name to register the local test tap under.
      TEST_TAP: marrusl/inspectah
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      # The tap is public, so the checkout needs no tap token, and
      # persist-credentials: false leaves no credential in .git/config for the
      # brew steps below to find.
      - name: Checkout tap repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.TAP_REPO }}
          ref: ${{ env.TAP_BRANCH }}
          path: homebrew-tap
          persist-credentials: false

      # A re-run of an older release's packaging run, made after a newer
      # release already reached the tap, would otherwise rewrite the formula
      # back to the older version and push it as an ordinary fast-forward.
      # Gem::Version orders prereleases below their release and compares
      # numeric parts as numbers (0.9.0-beta.9 < 0.9.0-beta.10 < 0.9.0),
      # which `sort -V` does not. An equal version carries on: the commit
      # step below turns an identical formula into a no-op.
      # homebrew-push repeats this check; keep the two in step.
      - name: Skip a release older than the tap
        id: order
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          # The tap commit the formula is rewritten against. homebrew-push
          # refuses to push unless the tap's main is still here.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$FORMULA")
          if [ "$(printf '%s' "$CURRENT" | grep -c '^')" -ne 1 ]; then
            echo "::error::could not read exactly one version from the tap's ${FORMULA}: '${CURRENT}'" >&2
            exit 1
          fi
          ORDER=$(ruby -e 'puts Gem::Version.new(ARGV[0]) <=> Gem::Version.new(ARGV[1])' "$VERSION" "$CURRENT")
          if [ "$ORDER" = "-1" ]; then
            echo "::notice::The tap is at ${CURRENT}, newer than ${VERSION}; this release is superseded. Nothing to test or push."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # The formula is a BINARY formula: its `install` is
      # `bin.install "inspectah-darwin-arm64" => "inspectah"`, so `url` must
      # point at the release asset of that name. This step previously
      # computed the *source tarball* URL and digest, which produced a
      # formula whose install looked for a file a source checkout does not
      # contain. Every automated tap PR since March has been unmergeable for
      # that reason, and the job reported success each time because opening
      # a PR is all it ever checked.
      - name: Resolve the darwin binary asset
        id: asset
        if: steps.order.outputs.proceed == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          ASSET_NAME: inspectah-darwin-arm64
          # release.yml attaches the asset to the draft before anyone can
          # publish it, so it is normally there already. The wait stays for a
          # release published some other way: on v0.9.0-beta.4, cut by hand,
          # the asset finished uploading in the same second the release was
          # published, a tie rather than a margin.
          ASSET_WAIT_ATTEMPTS: "30"
          ASSET_WAIT_SECONDS: "10"
          # sha256 of zero bytes. If curl ever writes an empty file and we
          # fail to notice, this is the digest we would publish.
          EMPTY_SHA256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"

          ok=""
          for i in $(seq 1 "$ASSET_WAIT_ATTEMPTS"); do
            # -f so an HTTP error is a non-zero exit rather than an error
            # page written to the output file and hashed as if it were the
            # binary.
            if curl -fsSL -o asset.bin "$URL"; then ok=yes; break; fi
            echo "attempt $i: ${ASSET_NAME} not downloadable yet, waiting"
            sleep "$ASSET_WAIT_SECONDS"
          done
          if [ -z "$ok" ]; then
            echo "::error::${URL} never became downloadable. The tap was not updated." >&2
            exit 1
          fi

          # shasum, not sha256sum: this job runs on macOS.
          SHA=$(shasum -a 256 asset.bin | cut -d' ' -f1)

          if [ "${#SHA}" -ne 64 ]; then
            echo "::error::computed sha256 is not 64 characters: '${SHA}'" >&2
            exit 1
          fi
          if [ "$SHA" = "$EMPTY_SHA256" ]; then
            echo "::error::asset hashed as empty; refusing to publish that digest" >&2
            exit 1
          fi

          echo "resolved ${ASSET_NAME} for ${RELEASE_TAG}: ${SHA}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # homebrew-push repeats this rewrite and compares the result with the
      # file this job tested; keep the two in step.
      - name: Update formula
        if: steps.order.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.asset.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
          ASSET_URL: ${{ steps.asset.outputs.url }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          # `version` was never substituted before, so a merged PR would have
          # left the old version beside the new url and failed the formula's
          # own test block, which asserts version.to_s appears in
          # `inspectah version` output. `install` is deliberately untouched.
          # -i.orig and then rm, because BSD sed on macOS and GNU sed disagree
          # on a bare -i.
          sed -i.orig \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  url \".*\"|  url \"${ASSET_URL}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            "$FORMULA"
          rm -f "${FORMULA}.orig"

          # Confirm each substitution actually landed. If the formula is ever
          # restructured so a pattern stops matching, sed exits 0 having
          # changed nothing and the job would otherwise report success while
          # delivering a stale formula.
          for expected in "version \"${VERSION}\"" "url \"${ASSET_URL}\"" "sha256 \"${SHA256}\""; do
            if ! grep -qF "$expected" "$FORMULA"; then
              echo "::error::substitution did not land: ${expected}" >&2
              echo "The formula may have been restructured. Not updating the tap." >&2
              exit 1
            fi
          done

          echo "Updated formula to ${VERSION} (sha256: ${SHA256})"

      - name: Commit the formula locally
        id: commit
        if: steps.order.outputs.proceed == 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          if git diff --cached --quiet; then
            # The substitutions are verified above, so reaching here means the
            # formula already matched this release: a re-run, or a tap someone
            # updated by hand. Not an error, but it must not look like a
            # delivered update either.
            echo "::notice::Formula already at ${TAG}; nothing to test or push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update inspectah to ${TAG}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Uploaded before brew runs anything, so the file homebrew-push receives
      # is the one written above. overwrite: a re-run of this job replaces the
      # previous attempt's file instead of failing on the name.
      - name: Hand the formula to the push job
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-formula
          path: homebrew-tap/${{ env.FORMULA }}
          if-no-files-found: error
          overwrite: true

      # Taps the local checkout, so brew installs exactly the formula that will
      # be pushed: it downloads the release asset, checks the sha256, installs,
      # and runs the formula's own test block.
      - name: Install and test the new formula
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          brew tap "$TEST_TAP" "${GITHUB_WORKSPACE}/homebrew-tap"
          brew install "${TEST_TAP}/inspectah"
          brew test "${TEST_TAP}/inspectah"
          inspectah version

  # Receives three values and one file, and treats all of them as data: it
  # never runs the formula, the binary or anything else from the release or
  # from homebrew-test's runner, and receives no .git, hooks or runner state.
  # It needs no macOS for that, so it runs on Linux.
  homebrew-push:
    needs: homebrew-test
    if: github.event_name == 'release' && needs.homebrew-test.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_REPO: marrusl/homebrew-inspectah
      TAP_BRANCH: main
      FORMULA: Formula/inspectah.rb
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.TAP_REPO }}
          ref: ${{ env.TAP_BRANCH }}
          path: homebrew-tap
          persist-credentials: false

      - name: Receive the tested formula
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homebrew-formula
          path: tested-formula

      # Rebuilds the tested commit rather than receiving it, and checks every
      # input on the way: the tap has not moved, the release is not older than
      # the tap, and the received file is exactly what the known rewrite of
      # the base produces. A received value that fails any check fails the
      # job before the token exists.
      - name: Rebuild the tested commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          ASSET_NAME: inspectah-darwin-arm64
          BASE: ${{ needs.homebrew-test.outputs.base }}
          SHA256: ${{ needs.homebrew-test.outputs.sha256 }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          TESTED="${GITHUB_WORKSPACE}/tested-formula/inspectah.rb"

          # Version and url come from the release payload, not from the test
          # job, so only the digest is taken on trust from there.
          VERSION="${RELEASE_TAG#v}"
          ASSET_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"

          # Fail, not re-evaluate. The tested formula was written against
          # BASE; on a moved main it is no longer the file that would land,
          # and a hand bump or a newer release may be what moved it. Re-run
          # homebrew-test, which re-reads the tap, re-tests and then runs
          # this job again.
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$BASE" ]; then
            echo "::error::the tap's ${TAP_BRANCH} moved from '${BASE}' to ${HEAD_SHA} after the formula was tested. Nothing was pushed; re-run homebrew-test." >&2
            exit 1
          fi

          if ! printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::received sha256 is not 64 lowercase hex characters: '${SHA256}'" >&2
            exit 1
          fi

          # The same check as homebrew-test's, so this job alone guarantees
          # the tap never moves to an older release.
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$FORMULA")
          if [ "$(printf '%s' "$CURRENT" | grep -c '^')" -ne 1 ]; then
            echo "::error::could not read exactly one version from the tap's ${FORMULA}: '${CURRENT}'" >&2
            exit 1
          fi
          ORDER=$(ruby -e 'puts Gem::Version.new(ARGV[0]) <=> Gem::Version.new(ARGV[1])' "$VERSION" "$CURRENT")
          if [ "$ORDER" = "-1" ]; then
            echo "::error::the tap is at ${CURRENT}, newer than ${VERSION}; refusing to push an older release." >&2
            exit 1
          fi

          # The same rewrite as homebrew-test's "Update formula" step.
          sed -i.orig \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  url \".*\"|  url \"${ASSET_URL}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            "$FORMULA"
          rm -f "${FORMULA}.orig"

          if ! cmp -s "$FORMULA" "$TESTED"; then
            echo "::error::the received formula is not the rewrite of ${BASE} for ${RELEASE_TAG}. Nothing was pushed." >&2
            diff -u "$TESTED" "$FORMULA" >&2 || true
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          if git diff --cached --quiet; then
            echo "::error::homebrew-test reported a change, but the rewrite of ${BASE} changes nothing. Nothing was pushed." >&2
            exit 1
          fi
          git commit -m "Update inspectah to ${RELEASE_TAG}"
          git show --stat HEAD

      # One ref update to the tap's main, so a refused push leaves nothing
      # behind on the tap: no branch, no pull request. If the token cannot
      # write to main, or main moved after the check above, git's error is in
      # this step's log and the job fails.
      - name: Push the formula to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          # The header actions/checkout would have set, built only here. The
          # base64 form is not a registered secret, so mask it too.
          AUTH=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${AUTH}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push origin "HEAD:${TAP_BRANCH}"
